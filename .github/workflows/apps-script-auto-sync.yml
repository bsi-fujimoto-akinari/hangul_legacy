name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      intended_smoke_sha:
        description: "Exact audited main SHA authorized for bounded credentialed Apps Script execution"
        required: false
        type: string
      migration_runtime_control:
        description: "P3/P4 migration runtime control: bounded C1/C6/C9/O1/P4 acceptance controls only"
        required: false
        default: "NONE"
        type: choice
        options:
          - "NONE"
          - "C1_READBACK"
          - "C1_QUIESCE"
          - "PRE_C6_READBACK"
          - "C6_ACTIVATE"
          - "C9_READBACK"
          - "P4_ACCEPTANCE5_READBACK"
          - "P4_PROSPECTIVE_ONE_SHOT"
          - "O1_RESUME"
      mig_asset_acceptance_2:
        description: "MIG-ASSET-ACCEPTANCE-2 bounded private-media read-only validation"
        required: false
        default: "NONE"
        type: choice
        options:
          - "NONE"
          - "AUTHORIZE_MIG_ASSET_ACCEPTANCE_2_READONLY"
      rem09_review_open_validation:
        description: "REM-09 exact-main 28 Review open validation"
        required: false
        default: "NO"
        type: choice
        options:
          - "NO"
          - "AUTHORIZE_REM09_28_OPEN_READONLY"
      rem09_d4_audio_parity_repair:
        description: "REM-09 bounded single-target D4 Review-audio parity repair"
        required: false
        default: "NONE"
        type: choice
        options:
          - "NONE"
          - "H3-20260914-02"
          - "H3-20260914-04"
      brg_monitor_owner_snapshot:
        description: "BRG Monitor one-revision read-only owner snapshot evidence"
        required: false
        default: "NONE"
        type: choice
        options:
          - "NONE"
          - "AUTHORIZE_BRG_MONITOR_OWNER_SNAPSHOT_READONLY"

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify exact audited main source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRIGGER_NAME: ${{ github.event_name }}
          TRIGGER_AUDIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          TRIGGER_AUDIT_EVENT: ${{ github.event.workflow_run.event || '' }}
          TRIGGER_AUDIT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=2

          checked_out="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$checked_out" != "$SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA does not match the resolved source SHA."
            exit 1
          fi
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Credentialed Apps Script work is restricted to the exact current main SHA."
            exit 1
          fi

          if [ "$TRIGGER_NAME" = "workflow_run" ]; then
            if [ "$TRIGGER_AUDIT_SHA" != "$SOURCE_SHA" ] || \
               [ "$TRIGGER_AUDIT_EVENT" != "push" ] || \
               [ "$TRIGGER_AUDIT_CONCLUSION" != "success" ]; then
              echo "::error::Triggering Repository audit is not a successful push audit for the exact source SHA."
              exit 1
            fi
          else
            python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          query = urllib.parse.urlencode({
              'branch': 'main',
              'status': 'completed',
              'per_page': '100',
          })
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'repository-audit.yml/runs?{query}'
          )
          req = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == sha
              and run.get('head_branch') == 'main'
              and run.get('event') == 'push'
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          ]
          if not matches:
              raise SystemExit(
                  'No successful Repository audit push run exists for the exact current main SHA.'
              )
          print(f'Exact audited main source verified: {sha}')
          PY
          fi

      - name: Detect read-only smoke preflight request
        id: smoke_request
        shell: bash
        env:
          INTENDED_SMOKE_SHA: ${{ github.event.inputs.intended_smoke_sha || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INTENDED_SMOKE_SHA" ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ steps.smoke_request.outputs.requested }}" = "true" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Detect automatic live smoke plan
        id: automatic_smoke_plan
        shell: bash
        run: |
          set -euo pipefail
          review_5w=false
          system_test_render=false

          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            {
              echo "requested=false"
              echo "review_5w=false"
              echo "system_test_render=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              WebApp.js|Client.html|WebAppObservability.js|WebAppLiveSmoke.js|appsscript.json)
                review_5w=true
                system_test_render=true
                ;;
              WebAppReview*.js|WebAppSurfaceReviewBridge*.js|WebAppWritten*.js)
                review_5w=true
                ;;
              WebApp*.js|Index.html|Stylesheet.html)
                system_test_render=true
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          requested=false
          if [ "$review_5w" = "true" ] || [ "$system_test_render" = "true" ]; then
            requested=true
          fi

          {
            echo "requested=$requested"
            echo "review_5w=$review_5w"
            echo "system_test_render=$system_test_render"
          } >> "$GITHUB_OUTPUT"

      - name: Detect synchronization-policy change
        id: policy_change
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | \
             grep -Fxq '.github/workflows/apps-script-auto-sync.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Detect Apps Script remote file-set drift
        id: remote_file_set
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$GITHUB_WORKSPACE"
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT

          cp "$repo_dir/.clasp.json" "$readback_dir/.clasp.json"
          (
            cd "$readback_dir"
            npx -y @google/clasp@3.4.0 pull >/tmp/h3-remote-file-set.out
          )

          REPO_DIR="$repo_dir" READBACK_DIR="$readback_dir" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          repo = Path(os.environ['REPO_DIR'])
          readback = Path(os.environ['READBACK_DIR'])
          expected = sorted(
              p for p in subprocess.check_output(
                  [
                      'git', '-C', str(repo), 'ls-files',
                      '*.js', '*.gs', '*.html', 'appsscript.json'
                  ],
                  text=True,
              ).splitlines()
              if p
          )
          actual = sorted(
              p.relative_to(readback).as_posix()
              for p in readback.rglob('*')
              if p.is_file()
              and p.name != '.clasp.json'
              and (
                  p.suffix in {'.js', '.gs', '.html'}
                  or p.name == 'appsscript.json'
              )
          )
          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          refresh = bool(missing or extra)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"refresh={'true' if refresh else 'false'}\n")
              output.write(f"missing_count={len(missing)}\n")
              output.write(f"extra_count={len(extra)}\n")
          print(
              'Apps Script remote file-set drift: '
              f"refresh={'true' if refresh else 'false'}; "
              f'missing={missing}; extra={extra}'
          )
          PY

      - name: Push audited main to Apps Script HEAD
        id: source_push
        if: (steps.impact.outputs.changed == 'true' || steps.remote_file_set.outputs.refresh == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          REMOTE_FILE_SET_REFRESH: ${{ steps.remote_file_set.outputs.refresh || 'false' }}
        run: |
          set -euo pipefail

          validate_push_output() {
            local label="$1"
            local value="$2"
            printf '%s\n' "$value"
            if printf '%s\n' "$value" | grep -q 'Skipping push'; then
              echo "::error::$label: clasp skipped the push."
              exit 1
            fi
            if ! printf '%s\n' "$value" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
              echo "::error::$label: clasp did not report a completed push."
              exit 1
            fi
          }

          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          validate_push_output "initial push" "$output"

          delete_only_refresh=false
          if [ "$REMOTE_FILE_SET_REFRESH" = "true" ] && \
             printf '%s\n' "$output" | grep -q '^Script is already up to date[.]$'; then
            marker_file="Code.js"
            exact_copy="$(mktemp)"
            cp "$marker_file" "$exact_copy"
            restore_exact() {
              cp "$exact_copy" "$marker_file"
            }
            trap 'restore_exact; rm -f "$exact_copy"' EXIT

            printf '\n// H3_DELETE_ONLY_SYNC_REFRESH\n' >> "$marker_file"
            nudge_output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
            validate_push_output "delete-only nudge push" "$nudge_output"
            if printf '%s\n' "$nudge_output" | grep -q '^Script is already up to date[.]$'; then
              echo "::error::Delete-only nudge did not force an Apps Script content update."
              exit 1
            fi

            restore_exact
            git diff --exit-code -- "$marker_file"
            final_output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
            validate_push_output "exact restore push" "$final_output"
            if printf '%s\n' "$final_output" | grep -q '^Script is already up to date[.]$'; then
              echo "::error::Exact restore push did not replace the temporary nudge."
              exit 1
            fi

            rm -f "$exact_copy"
            trap - EXIT
            delete_only_refresh=true
          fi

          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "delete_only_refresh=$delete_only_refresh" >> "$GITHUB_OUTPUT"

      - name: Attest Apps Script HEAD source against exact audited main
        id: source_attestation
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$GITHUB_WORKSPACE"
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT

          cp "$repo_dir/.clasp.json" "$readback_dir/.clasp.json"
          (
            cd "$readback_dir"
            npx -y @google/clasp@3.4.0 pull
          )

          REPO_DIR="$repo_dir" READBACK_DIR="$readback_dir" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = Path(os.environ['REPO_DIR'])
          readback = Path(os.environ['READBACK_DIR'])

          expected = sorted(
              p for p in subprocess.check_output(
                  [
                      'git', '-C', str(repo), 'ls-files',
                      '*.js', '*.gs', '*.html', 'appsscript.json'
                  ],
                  text=True,
              ).splitlines()
              if p
          )
          actual = sorted(
              p.relative_to(readback).as_posix()
              for p in readback.rglob('*')
              if p.is_file()
              and p.name != '.clasp.json'
              and (
                  p.suffix in {'.js', '.gs', '.html'}
                  or p.name == 'appsscript.json'
              )
          )

          if expected != actual:
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              raise SystemExit(
                  f'Apps Script readback file-set mismatch; missing={missing}; extra={extra}'
              )

          def normalized_text(path):
              text = path.read_text(encoding='utf-8')
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              return text.splitlines()

          digest_source = hashlib.sha256()
          digest_readback = hashlib.sha256()

          for rel in expected:
              source_path = repo / rel
              readback_path = readback / rel
              if rel == 'appsscript.json':
                  source_value = json.loads(source_path.read_text(encoding='utf-8'))
                  readback_value = json.loads(readback_path.read_text(encoding='utf-8'))
                  if source_value != readback_value:
                      raise SystemExit('Apps Script manifest readback mismatch.')
                  source_bytes = json.dumps(
                      source_value, sort_keys=True, separators=(',', ':')
                  ).encode('utf-8')
                  readback_bytes = json.dumps(
                      readback_value, sort_keys=True, separators=(',', ':')
                  ).encode('utf-8')
              else:
                  source_lines = normalized_text(source_path)
                  readback_lines = normalized_text(readback_path)
                  if source_lines != readback_lines:
                      raise SystemExit(f'Apps Script source readback mismatch: {rel}')
                  source_bytes = ('\n'.join(source_lines)).encode('utf-8')
                  readback_bytes = ('\n'.join(readback_lines)).encode('utf-8')

              digest_source.update(rel.encode('utf-8') + b'\0' + source_bytes + b'\0')
              digest_readback.update(rel.encode('utf-8') + b'\0' + readback_bytes + b'\0')

          source_sha = digest_source.hexdigest()
          readback_sha = digest_readback.hexdigest()
          if source_sha != readback_sha:
              raise SystemExit('Apps Script aggregate source attestation digest mismatch.')

          output_path = os.environ['GITHUB_OUTPUT']
          with open(output_path, 'a', encoding='utf-8') as output:
              output.write('attested=true\n')
              output.write(f'file_count={len(expected)}\n')
              output.write(f'source_digest={source_sha}\n')
              output.write(f'readback_digest={readback_sha}\n')

          print(
              f'Apps Script source attestation PASS: '
              f'{len(expected)} files; digest={source_sha}'
          )
          PY

      - name: Validate exact-main observability source-binding boundary
        id: source_binding_boundary
        if: steps.source_attestation.outputs.attested == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DIGEST: ${{ steps.source_attestation.outputs.source_digest || '' }}
          SOURCE_FILE_COUNT: ${{ steps.source_attestation.outputs.file_count || '' }}
          SOURCE_ATTESTED: ${{ steps.source_attestation.outputs.attested || '' }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_ATTESTED" != "true" ]; then
            echo "::error::Observability source binding requires immediate successful source attestation."
            exit 1
          fi
          python3 - "$SOURCE_SHA" "$SOURCE_DIGEST" "$SOURCE_FILE_COUNT" <<'PY'
          import json
          import pathlib
          import re
          import sys

          source_sha, source_digest, file_count = sys.argv[1:4]
          if re.fullmatch(r'[0-9a-f]{40}', source_sha) is None:
              raise SystemExit('Observability source SHA is not one exact immutable commit SHA.')
          if re.fullmatch(r'[0-9a-f]{64}', source_digest) is None:
              raise SystemExit('Observability source digest is invalid.')
          if not file_count.isdigit() or int(file_count) < 1:
              raise SystemExit('Observability source file count is invalid.')

          manifest = json.loads(pathlib.Path('appsscript.json').read_text(encoding='utf-8'))
          if manifest.get('executionApi', {}).get('access') != 'MYSELF':
              raise SystemExit('Observability source binding requires executionApi.access=MYSELF.')
          if manifest.get('webapp', {}).get('access') != 'MYSELF':
              raise SystemExit('Observability source binding requires webapp.access=MYSELF.')
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Bind exact-main observability source provenance
        if: steps.source_binding_boundary.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DIGEST: ${{ steps.source_attestation.outputs.source_digest }}
          SOURCE_FILE_COUNT: ${{ steps.source_attestation.outputs.file_count }}
        run: |
          set -euo pipefail
          params="$(python3 - "$SOURCE_SHA" "$SOURCE_DIGEST" "$SOURCE_FILE_COUNT" <<'PY'
          import json
          import sys

          print(json.dumps([{
              'schema': 'H3_OBSERVABILITY_SOURCE_BINDING_V1',
              'source_sha': sys.argv[1],
              'source_digest': sys.argv[2],
              'source_file_count': int(sys.argv[3]),
          }], separators=(',', ':')))
          PY
          )"
          out=/tmp/h3-observability-source-binding.out
          err=/tmp/h3-observability-source-binding.err
          set +e
          npx -y @google/clasp@3.4.0 --json run-function h3ObservabilityBindSource --params "$params" >"$out" 2>"$err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Exact-main observability source binding failed."
            cat "$err"
            cat "$out"
            exit "$status"
          fi
          python3 - "$out" "$SOURCE_SHA" "$SOURCE_DIGEST" "$SOURCE_FILE_COUNT" <<'PY'
          import json
          import sys

          envelope = json.loads(open(sys.argv[1], encoding='utf-8').read())
          if envelope.get('error'):
              raise SystemExit('Observability source binding returned an Apps Script error envelope.')
          result = envelope.get('response')
          if not isinstance(result, dict):
              raise SystemExit('Observability source binding response is not an object.')
          expected = {
              'schema': 'H3_OBSERVABILITY_SOURCE_BINDING_RESULT_V1',
              'status': 'PASS',
              'source_sha': sys.argv[2],
              'source_digest': sys.argv[3],
              'source_file_count': int(sys.argv[4]),
          }
          for key, value in expected.items():
              if result.get(key) != value:
                  raise SystemExit(
                      f'Observability source binding readback mismatch for {key}: '
                      f'{result.get(key)!r} != {value!r}'
                  )
          print(
              'Observability source binding PASS: '
              f"sha={result['source_sha']}; digest={result['source_digest']}; "
              f"files={result['source_file_count']}"
          )
          PY

      - name: Validate production trigger alignment boundary
        id: trigger_alignment_boundary
        if: steps.source_attestation.outputs.attested == 'true' && steps.auth.outputs.ready == 'true' && steps.source_binding_boundary.outputs.ready == 'true' && github.event_name == 'workflow_run'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TRIGGER_NAME: ${{ github.event_name }}
          TRIGGER_AUDIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          TRIGGER_AUDIT_EVENT: ${{ github.event.workflow_run.event || '' }}
          TRIGGER_AUDIT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          SOURCE_ATTESTED: ${{ steps.source_attestation.outputs.attested || '' }}
        run: python3 .github/scripts/production_trigger_alignment.py boundary >> "$GITHUB_OUTPUT"

      - name: Align production monitor trigger near minute 00
        if: steps.trigger_alignment_boundary.outputs.ready == 'true'
        shell: bash
        run: python3 .github/scripts/production_trigger_alignment.py execute

      - name: Validate automatic read-only live smoke boundary
        id: automatic_smoke_boundary
        if: steps.automatic_smoke_plan.outputs.requested == 'true' && steps.source_attestation.outputs.attested == 'true' && steps.source_binding_boundary.outputs.ready == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DIGEST: ${{ steps.source_attestation.outputs.source_digest || '' }}
          SOURCE_ATTESTED: ${{ steps.source_attestation.outputs.attested || '' }}
          REVIEW_5W: ${{ steps.automatic_smoke_plan.outputs.review_5w || 'false' }}
          SYSTEM_TEST_RENDER: ${{ steps.automatic_smoke_plan.outputs.system_test_render || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "::error::Automatic live smoke is restricted to the audited workflow_run path."
            exit 1
          fi
          if [ "$SOURCE_ATTESTED" != "true" ]; then
            echo "::error::Automatic live smoke requires immediate successful Apps Script source attestation."
            exit 1
          fi
          if [ "${{ github.event.workflow_run.head_sha }}" != "$SOURCE_SHA" ] || \
             [ "${{ github.event.workflow_run.event }}" != "push" ] || \
             [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Automatic live smoke trigger is not the successful exact-SHA Repository audit push run."
            exit 1
          fi
          python3 - "$SOURCE_SHA" "$SOURCE_DIGEST" "$REVIEW_5W" "$SYSTEM_TEST_RENDER" <<'PY'
          import re
          import sys

          source_sha, source_digest, review_5w, system_test = sys.argv[1:5]
          if re.fullmatch(r'[0-9a-f]{40}', source_sha) is None:
              raise SystemExit('Automatic live smoke source SHA is invalid.')
          if re.fullmatch(r'[0-9a-f]{64}', source_digest) is None:
              raise SystemExit('Automatic live smoke source digest is invalid.')
          if review_5w not in {'true', 'false'} or system_test not in {'true', 'false'}:
              raise SystemExit('Automatic live smoke plan booleans are invalid.')
          if review_5w != 'true' and system_test != 'true':
              raise SystemExit('Automatic live smoke boundary received an empty plan.')
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run impact-selected automatic live smoke
        id: automatic_live_smoke
        if: steps.automatic_smoke_boundary.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DIGEST: ${{ steps.source_attestation.outputs.source_digest }}
          REVIEW_5W: ${{ steps.automatic_smoke_plan.outputs.review_5w }}
          SYSTEM_TEST_RENDER: ${{ steps.automatic_smoke_plan.outputs.system_test_render }}
        run: |
          set -euo pipefail
          params="$(python3 - "$SOURCE_SHA" "$SOURCE_DIGEST" "$REVIEW_5W" "$SYSTEM_TEST_RENDER" <<'PY'
          import json
          import sys

          source_sha, source_digest, review_5w, system_test = sys.argv[1:5]
          suites = []
          if review_5w == 'true':
              suites.append('REVIEW_5W')
          if system_test == 'true':
              suites.append('SYSTEM_TEST_RENDER')
          print(json.dumps([{
              'schema': 'H3_AUTOMATIC_LIVE_SMOKE_REQUEST_V1',
              'source_sha': source_sha,
              'source_digest': source_digest,
              'suites': suites,
          }], separators=(',', ':')))
          PY
          )"

          out=/tmp/h3-automatic-live-smoke.out
          err=/tmp/h3-automatic-live-smoke.err
          set +e
          npx -y @google/clasp@3.4.0 --json run-function h3AutomaticLiveSmoke --params "$params" >"$out" 2>"$err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Automatic live smoke execution failed."
            cat "$err"
            cat "$out"
            exit "$status"
          fi

          python3 - "$out" "$SOURCE_SHA" "$SOURCE_DIGEST" "$REVIEW_5W" "$SYSTEM_TEST_RENDER" <<'PY'
          import json
          import sys

          envelope = json.loads(open(sys.argv[1], encoding='utf-8').read())
          if envelope.get('error'):
              raise SystemExit('Automatic live smoke returned an Apps Script error envelope.')

          result = envelope.get('response')
          if not isinstance(result, dict):
              raise SystemExit('Automatic live smoke response is not an object.')
          if result.get('schema') != 'H3_AUTOMATIC_LIVE_SMOKE_RESULT_V1':
              raise SystemExit(f"Unexpected automatic smoke schema: {result.get('schema')!r}")
          if result.get('status') != 'PASS':
              raise SystemExit(f"Automatic live smoke status is not PASS: {result.get('status')!r}")
          if result.get('write_performed') is not False:
              raise SystemExit('Automatic live smoke did not attest write_performed=false.')
          if result.get('source_sha') != sys.argv[2]:
              raise SystemExit('Automatic live smoke source SHA mismatch.')
          if result.get('source_digest') != sys.argv[3]:
              raise SystemExit('Automatic live smoke source digest mismatch.')

          expected = []
          if sys.argv[4] == 'true':
              expected.append('REVIEW_5W')
          if sys.argv[5] == 'true':
              expected.append('SYSTEM_TEST_RENDER')

          suites = result.get('suites')
          if not isinstance(suites, list):
              raise SystemExit('Automatic live smoke suites is not an array.')
          by_name = {
              item.get('suite'): item
              for item in suites
              if isinstance(item, dict)
          }
          if set(by_name) != set(expected):
              raise SystemExit(
                  f'Automatic live smoke suite set mismatch: {sorted(by_name)} != {sorted(expected)}'
              )

          if 'REVIEW_5W' in expected:
              item = by_name['REVIEW_5W']
              required = {
                  'status': 'PASS',
                  'schema': 'H3_PERSISTENT_WRITTEN_REVIEW_PAYLOAD_V1',
                  'mode': 'REVIEW',
                  'kind': 'WRITTEN',
                  'provider_kind': 'WRITTEN',
                  'surface_family': '5W',
                  'surface_set_no': 6,
                  'sections_len': 5,
                  'read_only': True,
              }
              for key, value in required.items():
                  if item.get(key) != value:
                      raise SystemExit(
                          f'REVIEW_5W smoke mismatch for {key}: {item.get(key)!r} != {value!r}'
                      )

          if 'SYSTEM_TEST_RENDER' in expected:
              item = by_name['SYSTEM_TEST_RENDER']
              required = {
                  'status': 'PASS',
                  'schema': 'H3_WEB_SET_V1',
                  'mode': 'SYSTEM_TEST',
                  'nonlearning': True,
                  'questions_len': 5,
                  'read_only': True,
              }
              for key, value in required.items():
                  if item.get(key) != value:
                      raise SystemExit(
                          f'SYSTEM_TEST_RENDER smoke mismatch for {key}: {item.get(key)!r} != {value!r}'
                      )

          print(
              'Automatic live smoke PASS: ' +
              ','.join(expected)
          )
          PY

          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "suites=$(python3 - "$REVIEW_5W" "$SYSTEM_TEST_RENDER" <<'PY'
          import sys
          suites = []
          if sys.argv[1] == 'true':
              suites.append('REVIEW_5W')
          if sys.argv[2] == 'true':
              suites.append('SYSTEM_TEST_RENDER')
          print(','.join(suites))
          PY
          )" >> "$GITHUB_OUTPUT"

