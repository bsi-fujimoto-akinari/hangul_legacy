name: Apps Script deployment read-only audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing reference deployment or read-only inventory
        type: choice
        required: true
        default: READ_ONLY_INVENTORY
        options:
          - READ_ONLY_INVENTORY
          - AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D
      diagnostic_mode:
        description: Standard inventory or separately owner-authorized one-shot OAuth refresh diagnostic
        type: choice
        required: true
        default: standard
        options:
          - standard
          - oauth_refresh_once

permissions:
  contents: read

concurrency:
  group: apps-script-deployment-readonly-audit
  cancel-in-progress: false

jobs:
  deployment-metadata:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate diagnostic selection before credential access
        run: python3 -c 'import json, os; from pathlib import Path; event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text()); inputs = event.get("inputs", {}); inputs = inputs if isinstance(inputs, dict) else {}; mode = inputs.get("diagnostic_mode", "standard"); target = inputs.get("target"); valid = (mode == "standard" and target in ("READ_ONLY_INVENTORY", "AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D")) or (mode == "oauth_refresh_once" and target == "READ_ONLY_INVENTORY"); raise SystemExit(0 if valid else "INVALID_AUDIT_INPUT")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable audited main before credential access
        run: python3 .github/scripts/apps_script_deployment_readonly_audit.py guard
      - name: Install pinned read-only CLI
        run: npm install --global --ignore-scripts @google/clasp@3.4.0
      - name: Read existing metadata
        if: inputs.diagnostic_mode == '' || inputs.diagnostic_mode == 'standard'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          AUDIT_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/apps_script_deployment_readonly_audit.py execute
      - name: Run explicitly selected one-shot OAuth refresh diagnostic
        if: inputs.diagnostic_mode == 'oauth_refresh_once' && inputs.target == 'READ_ONLY_INVENTORY'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          AUDIT_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/apps_script_deployment_readonly_audit.py execute-refresh-diagnostic
